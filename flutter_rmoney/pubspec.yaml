name: rmoney_flutter
description: RMoney personal finance tracker built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.4
  google_mobile_ads: ^9.1.0
  intl: ^0.19.0
  local_auth: ^3.0.2
  webview_flutter: ^4.14.1
  open_filex: ^4.7.0
  path_provider: ^2.1.4
  pdf: ^3.12.0
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/rmoney_logo.png
    - assets/fonts/arial_unicode.ttf
    - assets/scene/
